# =========================================================
# mimita.fun
# Version-controlled copy of /etc/nginx/sites-enabled/mimita-site.conf
# /api/coordinator/ and /api/duels/ are proxied to the ICE coordinator
# (127.0.0.1:3001); everything else under /api/ goes to the website API (3002).
# =========================================================

server {

    server_name mimita.fun www.mimita.fun;

    root /root/mimita-site/website/dist;

    index index.html;

    location / {

        try_files $uri $uri/ /index.html;
    }

    location /api/coordinator/ {

        proxy_pass http://127.0.0.1:3001;

        proxy_http_version 1.1;

        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/duels/ {

        proxy_pass http://127.0.0.1:3001;

        proxy_http_version 1.1;

        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {

        proxy_pass http://127.0.0.1:3002;

        proxy_http_version 1.1;

        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /avatars/ {

        proxy_pass http://127.0.0.1:3002;

        proxy_http_version 1.1;

        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /articles.generated.json {

        proxy_pass http://127.0.0.1:3002;

        proxy_http_version 1.1;

        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /news.generated.json {

        proxy_pass http://127.0.0.1:3002;

        proxy_http_version 1.1;

        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl;

    ssl_certificate /etc/letsencrypt/live/mimita.fun/fullchain.pem;

    ssl_certificate_key /etc/letsencrypt/live/mimita.fun/privkey.pem;

    include /etc/letsencrypt/options-ssl-nginx.conf;

    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = www.mimita.fun) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = mimita.fun) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name mimita.fun www.mimita.fun;
    return 404; # managed by Certbot
}
